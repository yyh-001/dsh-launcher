<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSH启动器</title>
  <meta name="description" content="轻量 DeepSeek Harness 管理器。选一个版本，启动 dsh web。" />
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <style>
    :root {
      --bg: #05070b;
      --fg: #fff;
      --mute: rgba(255, 255, 255, .55);
      --dim: rgba(255, 255, 255, .45);
      --line: rgba(255, 255, 255, .15);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); overflow-x: hidden; }
    body {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
      min-height: 100svh;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(720px 480px at 16% 42%, rgba(255, 255, 255, .05), transparent 58%);
    }
    a { color: inherit; }
    .wrap {
      position: relative;
      z-index: 1;
      width: calc(100% - 48px);
      max-width: 1140px;
      margin: 0 auto;
    }
    @media (min-width: 768px) {
      .wrap { width: calc(100% - 144px); }
    }
    header {
      display: flex;
      align-items: center;
      height: 50px;
      padding-top: 8px;
    }
    .gh {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      text-decoration: none;
      color: #fff;
    }
    .gh:hover { opacity: .8; }
    .gh svg.mark { width: 1.5rem; height: 1.5rem; fill: currentColor; flex-shrink: 0; }
    .gh-name { font-size: 1rem; font-weight: 500; }
    .stars {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      height: 1.5rem;
      padding: 0 .5rem;
      border: 1px solid var(--line);
      border-radius: .375rem;
      background: rgba(255, 255, 255, .06);
      color: rgba(255, 255, 255, .7);
      font-size: .75rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .stars svg { width: .875rem; height: .875rem; fill: currentColor; }
    .stage {
      display: grid;
      align-items: center;
      gap: 2.5rem;
      min-height: calc(100svh - 50px);
      padding: 1.5rem 0 2.5rem;
    }
    @media (min-width: 960px) {
      .stage {
        grid-template-columns: minmax(0, .86fr) minmax(0, 1.14fr);
        gap: 2rem;
      }
    }
    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 5vw, 3.85rem);
      font-weight: 500;
      letter-spacing: -.03em;
      line-height: 1.12;
    }
    .lead {
      margin: 1.5rem 0 0;
      max-width: 34rem;
      color: var(--mute);
      font-size: clamp(1.05rem, 1.6vw, 1.25rem);
      font-weight: 400;
      line-height: 1.55;
    }
    .note {
      display: flex;
      align-items: flex-start;
      gap: .5rem;
      margin: 1rem 0 0;
      max-width: 34rem;
      color: var(--dim);
      font-size: .8125rem;
      line-height: 1.45;
    }
    .note svg { width: 1rem; height: 1rem; flex-shrink: 0; margin-top: .1rem; opacity: .7; }
    .cta { margin-top: 1.7rem; display: flex; flex-wrap: wrap; gap: 1rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .65rem;
      height: 54px;
      padding: 0 1.25rem;
      border-radius: 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border: 0;
      white-space: nowrap;
    }
    .btn svg { width: 1.5rem; height: 1.5rem; fill: currentColor; }
    .btn-go { background: #fff; color: #000; }
    .btn-go:hover { background: rgba(255, 255, 255, .9); }
    .links { margin-top: 1.25rem; display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: center; }
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      height: 2.5rem;
      padding: 0 .875rem;
      border-radius: .625rem;
      border: 1px solid rgba(255, 255, 255, .2);
      color: rgba(255, 255, 255, .75);
      text-decoration: none;
      font-size: .875rem;
      font-weight: 500;
    }
    .btn-ghost:hover {
      border-color: rgba(255, 255, 255, .35);
      background: rgba(255, 255, 255, .07);
      color: #fff;
    }
    .btn-ghost svg { width: 1.125rem; height: 1.125rem; fill: currentColor; }
    .ver { color: rgba(255, 255, 255, .4); font-size: .8125rem; }
    .shot {
      margin: 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .1);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .45);
    }
    .shot img { display: block; width: 100%; }
    @media (min-width: 960px) {
      .visual { overflow: visible; }
      .shot { width: 118%; }
    }
    @media (max-width: 639px) {
      .gh-name { display: none; }
    }
    :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="gh" href="https://github.com/yyh-001/dsh-launcher" id="gh" aria-label="GitHub">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2.24c-3.22.7-3.9-1.37-3.9-1.37-.52-1.34-1.28-1.7-1.28-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.57-.3-5.28-1.29-5.28-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.16 1.18a10.9 10.9 0 0 1 5.75 0c2.2-1.49 3.16-1.18 3.16-1.18.62 1.59.23 2.77.11 3.06.74.81 1.18 1.84 1.18 3.1 0 4.42-2.71 5.39-5.29 5.68.42.36.78 1.07.78 2.15v3.27c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>
        <span class="gh-name">GitHub</span>
        <span class="stars" id="stars" title="GitHub stars">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
          <span id="star-count">Star</span>
        </span>
      </a>
    </header>
  </div>
  <div class="wrap stage">
    <div class="copy">
      <h1>DSH启动器</h1>
      <p class="lead">轻量 DeepSeek Harness 管理器。选一个版本，启动 dsh web。共用 web profile，换版本不用重装插件。</p>
      <p class="note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span>社区开源项目，并非 DeepSeek 官方产品，与 DeepSeek 无隶属或背书关系。</span>
      </p>
      <div class="cta">
        <a class="btn btn-go" id="download" href="https://github.com/yyh-001/dsh-launcher/releases/latest/download/DSH-Setup.exe">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4.2 10.5 3v8.15H2V4.2Zm9.5-1.34L22 1.35v9.8H11.5V2.86ZM2 12.15h8.5V20.3L2 19.1v-6.95Zm9.5 0H22v9.8l-10.5-1.51v-8.29Z"/></svg>
          下载 Windows 版
        </a>
      </div>
      <div class="links">
        <a class="btn-ghost" href="https://github.com/yyh-001/dsh-launcher">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2.24c-3.22.7-3.9-1.37-3.9-1.37-.52-1.34-1.28-1.7-1.28-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.57-.3-5.28-1.29-5.28-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.16 1.18a10.9 10.9 0 0 1 5.75 0c2.2-1.49 3.16-1.18 3.16-1.18.62 1.59.23 2.77.11 3.06.74.81 1.18 1.84 1.18 3.1 0 4.42-2.71 5.39-5.29 5.68.42.36.78 1.07.78 2.15v3.27c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>
          在 GitHub 上查看
        </a>
        <span class="ver" id="ver">v0.1.1</span>
      </div>
    </div>
    <div class="visual">
      <figure class="shot">
        <img src="./screenshot-home.png" alt="DSH启动器界面" />
      </figure>
    </div>
  </div>
  <script>
    function fmtStars(n) {
      if (n >= 1000) {
        const k = n / 1000
        return (k >= 10 ? k.toFixed(1) : k.toFixed(1)).replace(/\.0$/, "") + "K"
      }
      return String(n)
    }
    fetch("https://api.github.com/repos/yyh-001/dsh-launcher")
      .then((r) => r.ok ? r.json() : null)
      .then((repo) => {
        if (!repo) return
        const n = repo.stargazers_count
        document.getElementById("star-count").textContent = fmtStars(n)
        document.getElementById("gh").setAttribute("aria-label", "GitHub 仓库，" + n + " stars")
        document.getElementById("stars").title = n.toLocaleString() + " GitHub stars"
      })
      .catch(() => {})
    fetch("https://api.github.com/repos/yyh-001/dsh-launcher/releases/latest")
      .then((r) => r.ok ? r.json() : null)
      .then((rel) => {
        if (!rel || !rel.tag_name) return
        const asset = (rel.assets || []).find((a) => a.name === "DSH-Setup.exe")
        if (asset && asset.browser_download_url) {
          document.getElementById("download").href = asset.browser_download_url
        }
        document.getElementById("ver").textContent = rel.tag_name
      })
      .catch(() => {})
  </script>
</body>
</html>
