<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSH启动器</title>
  <link rel="icon" href="/favicon.ico?v=dsh" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon.png?v=dsh" />
  <style>
    :root {
      --bg: #090909;
      --card: #111;
      --line: #2a2a2a;
      --text: #f2f2f2;
      --muted: #8a8a8a;
      --accent: #fff;
      --accent-dim: #1c1c1c;
      --danger: #fff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
    }
    .brand { font-weight: 650; letter-spacing: 0.04em; font-size: 16px; }
    .brand-block { display: flex; align-items: baseline; gap: 10px; }
    .app-ver { color: var(--muted); font-size: 12px; }
    .app-ver:empty { display: none; }
    .self-update {
      border: 0;
      background: var(--accent);
      color: #111;
      font: 600 12px/1 inherit;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
    }
    .self-update:hover { filter: brightness(0.92); }
    .self-update[hidden] { display: none; }
    nav { display: flex; gap: 4px; background: #0c0c0c; padding: 4px; border-radius: 999px; border: 1px solid var(--line); }
    nav button {
      border: 0; background: transparent; color: var(--muted);
      padding: 6px 14px; border-radius: 999px; cursor: pointer; font: inherit;
    }
    nav button.active { background: var(--accent); color: #111; }
    main { min-height: 0; }
    .page { display: none; height: 100%; }
    .page.active { display: flex; }
    #page-home, #page-plugins, #page-settings { align-items: center; justify-content: center; padding: 24px; }
    .card {
      width: min(640px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
    }
    .card.settings { width: min(560px, 100%); }
    .card.plugins {
      width: min(720px, 100%);
      max-height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .card.settings .toggle:first-child { margin-top: 0; }
    .home-bar {
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }
    .home-main { flex: 1; min-width: 0; }
    .home-main label { margin-bottom: 8px; }
    @media (max-width: 560px) {
      .home-bar { flex-wrap: wrap; }
      .home-main { flex: 1 1 100%; }
      .controls { margin-left: auto; }
    }
    label { display: block; color: var(--muted); font-size: 12px; letter-spacing: 0.08em; margin-bottom: 8px; }
    input[type=text] {
      width: 100%;
      appearance: none;
      background: #0c0c0c;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
    }
    input[type=text]:focus { outline: 1px solid var(--accent); }
    /* 版本下拉：原生 select 的弹出列表无法跟随深色主题，这里整套自绘 */
    .select { position: relative; }
    .select-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #0c0c0c;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .select-trigger:hover:not(:disabled) { border-color: #3a3a3a; }
    .select-trigger:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
    .select-trigger:disabled { opacity: 0.5; cursor: not-allowed; }
    .select.open .select-trigger { border-color: #4a4a4a; background: #101010; }
    .select-value {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .select-caret {
      width: 12px;
      height: 8px;
      flex: 0 0 auto;
      color: var(--muted);
      transition: transform 0.16s ease;
    }
    .select.open .select-caret { transform: rotate(180deg); }
    .select-panel {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      z-index: 40;
      padding: 6px;
      background: #101010;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.6);
      max-height: min(46vh, 340px);
      overflow-y: auto;
      animation: select-in 0.12s ease;
    }
    .select-panel[hidden] { display: none; }
    @keyframes select-in {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: none; }
    }
    .select-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 9px;
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
    }
    .select-option + .select-option { margin-top: 1px; }
    .select-option.active { background: #1e1e1e; }
    .select-option.selected { background: #262626; }
    .select-option.selected .opt-name { font-weight: 600; }
    .select-option .opt-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .select-option .opt-badge {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
    }
    .select-option.selected .opt-badge { color: var(--text); border-color: #3d3d3d; }
    .select-option.more {
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
      border-top: 1px solid var(--line);
      border-radius: 0 0 9px 9px;
    }
    .select-option.more.active { background: #1a1a1a; color: var(--text); }
    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 18px 0 0;
      color: var(--text);
      font-size: 14px;
      letter-spacing: 0;
      cursor: pointer;
    }
    .toggle input {
      appearance: none;
      width: 44px;
      height: 26px;
      margin: 0;
      flex: 0 0 auto;
      background: #2a2a2a;
      border: 0;
      border-radius: 999px;
      position: relative;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .toggle input::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: #f2f2f2;
      border-radius: 50%;
      transition: transform 0.15s ease;
    }
    .toggle input:checked { background: var(--accent); }
    .toggle input:checked::after { background: #111; transform: translateX(18px); }
    .toggle input:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
    .hint { color: var(--muted); font-size: 13px; margin: 12px 0 0; min-height: 1.5em; }
    .hint a { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
    .progress {
      margin-top: 12px;
      height: 4px;
      background: #2a2a2a;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress[hidden] { display: none; }
    .progress-bar {
      height: 100%;
      width: 0;
      background: #fff;
      border-radius: 999px;
      transition: width 0.15s ease;
    }
    .progress.indeterminate .progress-bar {
      width: 32%;
      animation: progress-slide 1.1s ease-in-out infinite;
    }
    @keyframes progress-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(360%); }
    }
    .primary {
      width: 100%;
      border: 0;
      background: var(--accent);
      color: #111;
      font: 600 15px/1 inherit;
      padding: 13px 16px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .primary.loading { opacity: 1; cursor: wait; }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex: 0 0 auto;
    }
    .icon-btn {
      width: 46px;
      height: 46px;
      padding: 0;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: inherit;
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
    }
    .icon-btn .ico { display: none; }
    .icon-btn.play:not(.loading) .ico-play { display: block; }
    .icon-btn.stop:not(.loading) .ico-stop { display: block; }
    #main.icon-btn {
      width: 46px;
      flex: 0 0 auto;
      border: 0;
      background: var(--accent);
      color: #111;
    }
    #main.icon-btn.stop {
      background: #fff;
      color: #e11d48;
      border: 0;
    }
    #restart.icon-btn,
    #update.icon-btn,
    #remove.icon-btn {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
    }
    .icon-btn[hidden] { display: none; }
    .icon-btn.loading svg { display: none; }
    .spin {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }
    .icon-btn.loading .spin, .primary.loading .spin { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #page-log { flex-direction: column; padding: 0 28px 28px; }
    .logbar { display: flex; justify-content: flex-end; padding: 8px 0; }
    .logbar button {
      border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit;
    }
    #log {
      flex: 1;
      margin: 0;
      overflow: auto;
      background: #050505;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      color: #9a9a9a;
      font: 12px/1.45 ui-monospace, Consolas, monospace;
      white-space: pre-wrap;
    }
    .plugin-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .plugin-title { color: var(--text); font-size: 15px; font-weight: 650; letter-spacing: 0.02em; }
    .plugin-sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .ghost {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .ghost:hover { color: var(--text); border-color: #3d3d3d; }
    .ghost:disabled { opacity: 0.5; cursor: default; }
    .plugin-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      /* 给滚动条留位置，开关不会被压住 */
      padding-right: 10px;
      margin-right: -10px;
    }
    .plugin-row {
      margin: 0;
      padding: 13px 8px;
      border-bottom: 1px solid var(--line);
      align-items: center;
      gap: 14px;
      border-radius: 10px;
      transition: background 0.12s ease;
    }
    .plugin-row:hover { background: #161616; }
    .plugin-row:last-child { border-bottom: 0; }
    .plugin-row.off .plugin-name { color: var(--muted); font-weight: 500; }
    .plugin-row.off .plugin-meta { opacity: 0.75; }
    .plugin-row input:disabled { opacity: 0.4; cursor: not-allowed; }
    .plugin-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .plugin-name { color: var(--text); font-weight: 600; font-size: 14px; letter-spacing: 0; overflow-wrap: anywhere; }
    .plugin-meta { color: var(--muted); font-size: 12px; letter-spacing: 0; overflow-wrap: anywhere; }
    .plugin-empty { color: var(--muted); font-size: 13px; padding: 10px 8px; }
    /* 深色滚动条：默认亮色条在暗色面板上很扎眼，统一成细灰条 */
    .select-panel, .plugin-list, #log { scrollbar-width: thin; scrollbar-color: #333 transparent; }
    .select-panel::-webkit-scrollbar, .plugin-list::-webkit-scrollbar, #log::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .select-panel::-webkit-scrollbar-track, .plugin-list::-webkit-scrollbar-track, #log::-webkit-scrollbar-track {
      background: transparent;
    }
    .select-panel::-webkit-scrollbar-thumb, .plugin-list::-webkit-scrollbar-thumb, #log::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    .select-panel::-webkit-scrollbar-thumb:hover, .plugin-list::-webkit-scrollbar-thumb:hover, #log::-webkit-scrollbar-thumb:hover {
      background: #4d4d4d;
      background-clip: content-box;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-block">
      <div class="brand">DSH启动器</div>
      <span class="app-ver" id="appVer">__APP_VERSION__</span>
      <button type="button" class="self-update" id="selfUpdate" hidden>更新</button>
    </div>
    <nav>
      <button class="active" data-tab="home">控制</button>
      <button data-tab="plugins">插件</button>
      <button data-tab="log">终端</button>
      <button data-tab="settings">设置</button>
    </nav>
  </header>
  <main>
    <div id="page-home" class="page active">
      <div class="card home">
        <div class="home-bar">
          <div class="home-main">
            <label for="versionTrigger">版本</label>
            <div class="select" id="versionPicker">
              <button type="button" class="select-trigger" id="versionTrigger" aria-haspopup="listbox" aria-expanded="false">
                <span class="select-value" id="versionValue">加载中…</span>
                <svg class="select-caret" viewBox="0 0 12 8" aria-hidden="true"><path fill="currentColor" d="M0 0h12L6 8z"/></svg>
              </button>
              <div class="select-panel" id="versionPanel" role="listbox" hidden></div>
            </div>
          </div>
          <div class="controls">
            <button class="icon-btn" id="update" type="button" hidden aria-label="更新" title="更新">
              <span class="spin" aria-hidden="true"></span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M12.75 16.5a.75.75 0 0 1-1.5 0V8.81L8.53 11.53a.75.75 0 1 1-1.06-1.06l4-4a.75.75 0 0 1 1.06 0l4 4a.75.75 0 1 1-1.06 1.06L12.75 8.81V16.5Z"/>
                <path fill="currentColor" d="M5.5 18.25h13a.75.75 0 0 1 0 1.5h-13a.75.75 0 0 1 0-1.5Z"/>
              </svg>
            </button>
            <button class="icon-btn" id="restart" type="button" hidden aria-label="重启" title="重启">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 12a8 8 0 1 1-2.3-5.6"/>
                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 4.5V10h-5.5"/>
              </svg>
            </button>
            <button class="icon-btn" id="remove" type="button" hidden aria-label="卸载" title="卸载">
              <span class="spin" aria-hidden="true"></span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M9.25 3.5h5.5a.75.75 0 0 1 0 1.5h-5.5a.75.75 0 0 1 0-1.5Z"/>
                <path fill="currentColor" d="M4.5 6.75h15a.75.75 0 0 1 0 1.5h-.52l-.78 10.05A2.5 2.5 0 0 1 15.72 20.7H8.28a2.5 2.5 0 0 1-2.48-2.4L5.02 8.25H4.5a.75.75 0 0 1 0-1.5Z"/>
              </svg>
            </button>
            <button class="icon-btn play" id="main" type="button" aria-label="启动" title="启动">
              <span class="spin" aria-hidden="true"></span>
              <svg class="ico ico-play" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M8.2 5.4v13.2c0 .7.8 1.1 1.4.7l10.2-6.6c.6-.4.6-1.2 0-1.6L9.6 4.7c-.6-.4-1.4 0-1.4.7Z"/>
              </svg>
              <svg class="ico ico-stop" viewBox="0 0 24 24" aria-hidden="true">
                <rect fill="currentColor" x="6.5" y="6.5" width="11" height="11" rx="2.2"/>
              </svg>
            </button>
          </div>
        </div>
        <p class="hint" id="hint">插件和数据在用户目录的 .dsh。</p>
        <div class="progress" id="progress" hidden>
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>
    </div>
    <div id="page-plugins" class="page">
      <div class="card plugins">
        <div class="plugin-head">
          <div>
            <div class="plugin-title">插件</div>
            <div class="plugin-sub" id="pluginSub">web profile</div>
          </div>
          <button class="ghost" id="pluginRefresh" type="button">刷新</button>
        </div>
        <div class="plugin-list" id="pluginList"></div>
        <p class="hint" id="pluginHint"></p>
      </div>
    </div>
    <div id="page-log" class="page">
      <div class="logbar"><button type="button" id="clear">清空</button></div>
      <pre id="log"></pre>
    </div>
    <div id="page-settings" class="page">
      <div class="card settings">
        <label class="toggle"><span>开机自启</span><input id="autoStart" type="checkbox" /></label>
        <label class="toggle"><span>自动安装插件市场</span><input id="seedMarket" type="checkbox" /></label>
        <label class="toggle"><span>启动失败自动禁用问题插件（兼容模式）</span><input id="autoDisable" type="checkbox" /></label>
        <button class="primary" id="saveSettings" type="button" style="margin-top: 22px">保存</button>
        <p class="hint" id="settingsHint"></p>
      </div>
    </div>
  </main>
  <script>
    // ---- 版本下拉（自绘，替代原生 select）----
    const versionRootEl = document.getElementById('versionPicker')
    const versionTriggerEl = document.getElementById('versionTrigger')
    const versionValueEl = document.getElementById('versionValue')
    const versionPanelEl = document.getElementById('versionPanel')
    let versionOptions = []      // [{ value, text, badge?, more? }]
    let versionValue = ''
    let versionDisabled = false
    let versionOpen = false
    let versionActive = -1
    let versionOnChange = () => {}

    function versionBadgeText(option) {
      return option?.badge ? `${option.text} · ${option.badge}` : option?.text || ''
    }

    function paintVersionTrigger() {
      const hit = versionOptions.find((option) => option.value === versionValue)
      versionValueEl.textContent = versionBadgeText(hit) || '暂无版本'
      versionTriggerEl.disabled = versionDisabled
      versionTriggerEl.setAttribute('aria-expanded', String(versionOpen))
      versionRootEl.classList.toggle('open', versionOpen)
    }

    function paintVersionPanel() {
      versionPanelEl.innerHTML = versionOptions.map((option, index) => {
        const cls = ['select-option']
        if (option.value === versionValue) cls.push('selected')
        if (option.more) cls.push('more')
        if (index === versionActive) cls.push('active')
        return `<div class="${cls.join(' ')}" data-index="${index}" role="option" aria-selected="${option.value === versionValue}">
          <span class="opt-name">${escapeHtml(option.text)}</span>
          ${option.badge ? `<span class="opt-badge">${escapeHtml(option.badge)}</span>` : ''}
        </div>`
      }).join('')
      versionPanelEl.querySelectorAll('.select-option').forEach((el) => {
        const index = Number(el.dataset.index)
        el.addEventListener('click', () => chooseVersionOption(index))
        el.addEventListener('mouseenter', () => {
          versionActive = index
          paintVersionActive()
        })
      })
    }

    function paintVersionActive() {
      versionPanelEl.querySelectorAll('.select-option').forEach((el, index) => {
        el.classList.toggle('active', index === versionActive)
      })
    }

    function scrollVersionActive() {
      versionPanelEl.querySelector('.select-option.active')?.scrollIntoView({ block: 'nearest' })
    }

    function openVersionPanel() {
      if (versionDisabled || !versionOptions.length) return
      versionOpen = true
      versionActive = Math.max(0, versionOptions.findIndex((option) => option.value === versionValue))
      paintVersionPanel()
      paintVersionTrigger()
      versionPanelEl.hidden = false
      scrollVersionActive()
      versionTriggerEl.focus()
    }

    function closeVersionPanel() {
      if (!versionOpen) return
      versionOpen = false
      versionPanelEl.hidden = true
      paintVersionTrigger()
    }

    function chooseVersionOption(index) {
      const option = versionOptions[index]
      if (!option) return
      if (option.more) {
        // 展开/收起：面板要保持打开，render() 会重建列表
        versionOnChange(option.value, true)
        return
      }
      versionValue = option.value
      versionOnChange(option.value, false)
      closeVersionPanel()
    }

    function moveVersionActive(delta) {
      if (!versionOptions.length) return
      versionActive = Math.min(versionOptions.length - 1, Math.max(0, versionActive + delta))
      paintVersionActive()
      scrollVersionActive()
    }

    versionTriggerEl.addEventListener('click', () => {
      if (versionOpen) closeVersionPanel()
      else openVersionPanel()
    })
    // 面板打开时焦点在触发器上，键盘事件统一在这里处理（也兜住从面板里冒泡上来的）
    versionRootEl.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        if (!versionOpen) return
        event.preventDefault()
        closeVersionPanel()
        versionTriggerEl.focus()
        return
      }
      if (event.key === 'Tab') {
        closeVersionPanel()
        return
      }
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault()
        if (!versionOpen) { openVersionPanel(); return }
        moveVersionActive(event.key === 'ArrowDown' ? 1 : -1)
        return
      }
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault()
        if (!versionOpen) openVersionPanel()
        else chooseVersionOption(versionActive)
        return
      }
      if (event.key === 'Home' && versionOpen) {
        event.preventDefault()
        versionActive = 0
        paintVersionActive()
        scrollVersionActive()
      }
      if (event.key === 'End' && versionOpen) {
        event.preventDefault()
        versionActive = versionOptions.length - 1
        paintVersionActive()
        scrollVersionActive()
      }
    })
    document.addEventListener('click', (event) => {
      if (!versionRootEl.contains(event.target)) closeVersionPanel()
    })

    const hintEl = document.getElementById('hint')
    const mainEl = document.getElementById('main')
    const restartEl = document.getElementById('restart')
    const updateEl = document.getElementById('update')
    const removeEl = document.getElementById('remove')
    const logEl = document.getElementById('log')
    let remote = { tags: {}, versions: [] }
    let state = { installed: [], running: null, installing: null, loaded: false }
    let picked = ''
    let userPicked = false
    let action = ''
    let installProgress = null
    let barPhase = ''
    let barMaxPct = 0
    // 下拉默认只列已装 + 最新 + 最近几个版本，其余折起来（原生下拉太长会顶出屏幕）
    const RECENT_REMOTE_LIMIT = 5
    let showAllVersions = false
    const fromLauncher = new URLSearchParams(location.search).has('launch')
    let launchFollowed = false
    let launchRequested = false

    const post = (path, body = {}) => fetch(path, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    }).then(async (res) => {
      const data = await res.json()
      if (!res.ok) throw new Error(data.error || res.statusText)
      return data
    })

    document.querySelectorAll('nav [data-tab]').forEach((button) => {
      button.onclick = () => {
        document.querySelectorAll('nav [data-tab]').forEach((item) => item.classList.toggle('active', item === button))
        document.querySelectorAll('.page').forEach((page) => page.classList.toggle('active', page.id === `page-${button.dataset.tab}`))
        if (button.dataset.tab === 'settings') loadSettings()
        if (button.dataset.tab === 'plugins') loadPlugins()
      }
    })

    function versionNames(list) {
      if (!Array.isArray(list)) return []
      return list.map((item) => {
        if (typeof item === 'string') return item.trim()
        if (item && typeof item.version === 'string') return item.version.trim()
        return ''
      }).filter(Boolean)
    }

    function setProgress(busy) {
      const wrap = document.getElementById('progress')
      const bar = document.getElementById('progress-bar')
      if (!wrap || !bar) return
      if (!busy) {
        wrap.hidden = true
        wrap.classList.remove('indeterminate')
        bar.style.width = '0%'
        barPhase = ''
        barMaxPct = 0
        return
      }
      wrap.hidden = false
      const total = Number(installProgress?.total) || 0
      const done = Number(installProgress?.done) || 0
      const phase = installProgress?.phase || ''
      if (phase !== barPhase) {
        barPhase = phase
        barMaxPct = 0
      }
      let pct = 0
      if (phase === 'resolve') {
        pct = Math.min(92, Math.round(100 * (1 - Math.exp(-done / 220))))
      } else if (total) {
        pct = Math.max(2, Math.min(100, Math.round((done / total) * 100)))
      } else {
        wrap.classList.add('indeterminate')
        bar.style.width = ''
        return
      }
      wrap.classList.remove('indeterminate')
      barMaxPct = Math.max(barMaxPct, pct)
      bar.style.width = `${barMaxPct}%`
    }

    function progressHint(prefix) {
      const total = Number(installProgress?.total) || 0
      const done = Number(installProgress?.done) || 0
      const phase = installProgress?.phase
      if (phase === 'resolve') {
        return done ? `${prefix}… 已解析 ${done} 个依赖` : `${prefix}…`
      }
      if (!total) return done ? `${prefix}… 已安装 ${done} 个包` : `${prefix}…`
      return `${prefix} ${done}/${total}（${Math.round((done / total) * 100)}%）`
    }

    function setMainAction(mode, label) {
      mainEl.classList.toggle('play', mode === 'play')
      mainEl.classList.toggle('stop', mode === 'stop')
      mainEl.setAttribute('aria-label', label)
      mainEl.title = label
    }

    function installedList() {
      return versionNames(state.installed)
    }

    function isManagedVersion(version) {
      const row = (state.versions || []).find((item) => item && item.version === version)
      if (row && 'managed' in row) return row.managed !== false
      return true
    }

    function runningInfo() {
      if (state.running && state.running.version) return state.running
      const row = (state.versions || []).find((item) => item && (item.status === 'running' || item.status === 'starting'))
      return row ? { version: row.version, status: row.status, url: row.url } : null
    }

    function allVersionList() {
      const remoteVersions = versionNames(remote.versions)
      const extra = installedList().filter((version) => !remoteVersions.includes(version))
      return [...extra, ...remoteVersions]
    }

    /** 折叠后的可见版本：已装、最新、当前选中永远保留，其余远程版本只留最近几个。 */
    function visibleVersionList(all) {
      if (showAllVersions) return all
      const keep = new Set(installedList())
      const latest = latestRemoteVersion()
      if (latest) keep.add(latest)
      if (userPicked && picked) keep.add(picked)
      const shown = []
      let slots = RECENT_REMOTE_LIMIT
      for (const version of all) {
        if (keep.has(version)) { shown.push(version); continue }
        if (slots > 0) { shown.push(version); slots -= 1 }
      }
      return shown
    }

    function versionList() {
      return visibleVersionList(allVersionList())
    }

    function latestRemoteVersion() {
      const tagged = typeof remote.tags?.latest === 'string' ? remote.tags.latest.trim() : ''
      return tagged || versionNames(remote.versions)[0] || ''
    }

    function preferredPick() {
      const versions = versionList()
      const installed = installedList()
      if (userPicked && picked && versions.includes(picked)) return picked
      const running = runningInfo()
      if (running?.version && versions.includes(running.version)) return running.version
      const latest = latestRemoteVersion()
      if (latest && installed.includes(latest)) return latest
      if (installed[0] && versions.includes(installed[0])) return installed[0]
      return latest || versions[0] || ''
    }

    function selected() {
      return versionValue || preferredPick()
    }

    function render() {
      const have = new Set(installedList())
      const allVersions = allVersionList()
      const versions = visibleVersionList(allVersions)
      const hidden = allVersions.length - versions.length
      const current = preferredPick() || versions[0] || ''
      const latest = latestRemoteVersion()
      const nextOptions = versions.map((version) => ({
        value: version,
        text: version,
        badge: have.has(version) ? '已装' : version === latest ? '最新' : '',
      }))
      if (hidden > 0) nextOptions.push({ value: '__more__', text: `更多版本…（还有 ${hidden} 个）`, more: true })
      else if (showAllVersions && allVersions.length > RECENT_REMOTE_LIMIT + 2) {
        nextOptions.push({ value: '__less__', text: '收起旧版本', more: true })
      }
      versionOptions = nextOptions
      if (nextOptions.some((option) => option.value === current)) versionValue = current
      else if (!nextOptions.some((option) => option.value === versionValue)) versionValue = nextOptions[0]?.value || ''
      paintVersionTrigger()
      if (versionOpen) paintVersionPanel()

      const version = versionValue
      const running = runningInfo()
      const thisRun = Boolean(running && running.version === version)
      const live = Boolean(running && (running.status === 'running' || running.status === 'starting'))
      const updating = action === 'update' || Boolean(latest && state.installing === latest && version !== latest)
      const installing = state.installing === version || action === 'install' || updating
      const starting = (thisRun && running.status === 'starting') || action === 'start'
      const stopping = (thisRun && running.status === 'stopping') || action === 'stop'
      const uninstalling = action === 'uninstall'
      const loading = installing || starting || stopping || uninstalling
      const canUpdate = Boolean(latest && have.has(version) && version !== latest)
      restartEl.hidden = !(thisRun && running.status === 'running') || loading
      updateEl.hidden = !(canUpdate || updating) || (loading && !updating)
      updateEl.disabled = loading
      updateEl.classList.toggle('loading', updating)
      updateEl.setAttribute('aria-label', latest ? `更新到 ${latest}` : '更新')
      updateEl.title = latest ? `更新到 ${latest}` : '更新'
      removeEl.hidden = !have.has(version) || live || (loading && !uninstalling)
      removeEl.disabled = loading
      removeEl.classList.toggle('loading', uninstalling)
      versionDisabled = loading || live
      if (versionDisabled) closeVersionPanel()
      paintVersionTrigger()
      mainEl.hidden = updating || uninstalling
      mainEl.disabled = loading || !version
      mainEl.classList.toggle('loading', loading && !updating && !uninstalling)
      setProgress(installing)

      if (updating) {
        hintEl.textContent = progressHint(`正在更新到 ${latest}`)
        setMainAction('play', '启动')
        return
      }

      if (installing) {
        hintEl.textContent = progressHint('正在安装')
        setMainAction('play', '安装中')
        return
      }
      if (starting) {
        hintEl.textContent = '正在启动…'
        setMainAction('play', '启动中')
        return
      }
      if (stopping) {
        hintEl.textContent = '正在停止…'
        setMainAction('stop', '停止中')
        return
      }
      if (uninstalling) {
        hintEl.textContent = '正在卸载…'
        setMainAction('play', '启动')
        return
      }
      if (thisRun && running.status === 'running') {
        const mode = '运行中'
        const fixed = stateAutoFix()
        const note = fixed ? `<br>启动时自动禁用了：${escapeHtml(fixed)}（插件页可恢复）` : ''
        const health = state.health && state.health.url === running.url ? state.health : null
        // 只在自检发现问题时提示；一切正常就不打扰
        const healthNote = health?.failed?.length
          ? `<br>⚠ 页面自检：${health.failed.length}/${health.total} 个插件包加载失败`
          : ''
        hintEl.innerHTML = `${mode} · <a href="${running.url}" target="_blank" rel="noreferrer">${running.url}</a>${note}${healthNote}`
        setMainAction('stop', '停止')
        return
      }
      if (!version) {
        hintEl.textContent = remote.versions?.length ? '读不到远程版本。' : '正在读取版本…'
        setMainAction('play', '启动')
        return
      }
      if (have.has(version)) {
        hintEl.textContent = latest && version !== latest
          ? `已安装。可更新到 ${latest}。`
          : '已安装。插件和数据在用户目录的 .dsh。'
        setMainAction('play', '启动')
        return
      }
      hintEl.textContent = version === latest ? '最新版本，尚未安装。' : '尚未安装。'
      setMainAction('play', '安装并启动')
    }

    versionOnChange = (value, keepOpen) => {
      if (value === '__more__' || value === '__less__') {
        showAllVersions = value === '__more__'
        render()
        // 展开/收起只是改变列表长度，面板继续开着，光标停在切换项上
        if (keepOpen || versionOpen) {
          openVersionPanel()
          const anchor = value === '__more__' ? '__less__' : '__more__'
          const found = versionOptions.findIndex((option) => option.value === anchor)
          versionActive = found >= 0 ? found : versionOptions.length - 1
          paintVersionActive()
          scrollVersionActive()
        }
        return
      }
      picked = value
      userPicked = true
      render()
    }

    async function startVersion(version) {
      try {
        if (!installedList().includes(version)) {
          action = 'install'
          render()
          await post('/api/install', { version })
        }
        action = 'start'
        render()
        const data = await post('/api/start', { version })
        if (data.url) {
          try {
            await post('/api/open', { url: data.url })
          } catch {
            window.open(data.url, '_blank', 'noopener')
          }
        }
      } finally {
        action = ''
        render()
      }
    }

    mainEl.onclick = async () => {
      const version = selected()
      if (!version) return
      const running = runningInfo()
      if (running && running.version === version && (running.status === 'running' || running.status === 'starting')) {
        action = 'stop'
        render()
        try {
          await post('/api/stop', { version })
        } catch (error) {
          alert(error.message)
        } finally {
          action = ''
          render()
        }
        return
      }
      try {
        await startVersion(version)
      } catch (error) {
        alert(error.message)
      }
    }
    restartEl.onclick = async () => {
      const version = selected()
      if (!version) return
      action = 'stop'
      render()
      try {
        await post('/api/stop', { version })
        await startVersion(version)
      } catch (error) {
        action = ''
        render()
        alert(error.message)
      }
    }
    updateEl.onclick = async () => {
      const latest = latestRemoteVersion()
      if (!latest) return
      const running = runningInfo()
      const wasLive = Boolean(running && (running.status === 'running' || running.status === 'starting'))
      try {
        if (wasLive) {
          action = 'stop'
          render()
          await post('/api/stop', { version: running.version })
        }
        picked = latest
        userPicked = true
        if (!installedList().includes(latest)) {
          action = 'update'
          render()
          await post('/api/install', { version: latest })
        }
        if (wasLive) {
          await startVersion(latest)
          return
        }
        action = ''
        render()
      } catch (error) {
        action = ''
        render()
        alert(error.message)
      }
    }
    removeEl.onclick = async () => {
      const version = selected()
      if (!version) return
      const system = !isManagedVersion(version)
      const ok = confirm(system
        ? `卸载 ${version}？这是系统里的 DSH，会从本机移除。插件和数据会保留。`
        : `卸载 ${version}？插件和数据会保留。`)
      if (!ok) return
      action = 'uninstall'
      render()
      try {
        await post('/api/uninstall', { version })
      } catch (error) {
        alert(error.message)
      } finally {
        action = ''
        render()
      }
    }
    document.getElementById('clear').onclick = () => { logEl.textContent = '' }

    function followLaunch(url) {
      if (!fromLauncher || launchFollowed || !url) return
      launchFollowed = true
      post('/api/open', { url }).catch(() => {
        window.open(url, '_blank', 'noopener')
      })
      history.replaceState({}, '', '/')
    }

    function maybeLaunch() {
      if (!fromLauncher || launchFollowed || !state.loaded) return
      const running = runningInfo()
      if (running?.url && running.status === 'running') {
        followLaunch(running.url)
        return
      }
      if (running?.status === 'starting') {
        action = 'start'
        render()
        return
      }
      if (!installedList().length || launchRequested) return
      launchRequested = true
      action = 'start'
      render()
      post('/api/launch').then((data) => {
        if (data.url) followLaunch(data.url)
        else {
          action = ''
          render()
        }
      }).catch((error) => {
        action = ''
        launchRequested = false
        render()
        alert(error.message)
      })
    }

    function applyState(data) {
      if (!data || typeof data !== 'object') return
      const installed = [...new Set([...versionNames(data.installed), ...versionNames(data.versions)])]
      let running = null
      if (data.running && data.running.version) {
        running = { version: data.running.version, status: data.running.status, url: data.running.url }
      } else if (Array.isArray(data.versions)) {
        const row = data.versions.find((item) => item && (item.status === 'running' || item.status === 'starting'))
        if (row?.version) running = { version: row.version, status: row.status, url: row.url }
      }
      state = {
        installing: data.installing ?? null,
        installed,
        versions: data.versions,
        running,
        autoFix: data.autoFix ?? null,
        health: data.health ?? null,
        loaded: true,
      }
      if (data.progress) installProgress = data.progress
      if (!data.installing) installProgress = data.progress || null
      if (!userPicked) picked = preferredPick()
      render()
      maybeLaunch()
    }

    function listenEvents() {
      const events = new EventSource('/api/events')
      events.addEventListener('state', (event) => {
        applyState(JSON.parse(event.data))
      })
      events.addEventListener('message', (event) => {
        try {
          const data = JSON.parse(event.data)
          if (data && (data.installed || data.versions || data.running)) applyState(data)
        } catch {
          // ignore non-state messages
        }
      })
      events.addEventListener('progress', (event) => {
        try {
          const data = JSON.parse(event.data)
          if (!data || data.phase === 'idle') installProgress = null
          else installProgress = data
          render()
        } catch {
          // ignore
        }
      })
      events.addEventListener('log', (event) => {
        const data = JSON.parse(event.data)
        const lines = data.lines || (data.line ? [data.line] : [])
        for (const line of lines) {
          logEl.textContent += (logEl.textContent ? '\n' : '') + line
          const unpacked = String(line).match(/^已解开 (\d+)\/(\d+)/)
          const downloading = String(line).match(/^下载 (\d+) 个包/)
          if (unpacked) {
            installProgress = { phase: 'download', done: Number(unpacked[1]), total: Number(unpacked[2]) }
            render()
          } else if (downloading) {
            installProgress = { phase: 'download', done: 0, total: Number(downloading[1]) }
            render()
          } else if (String(line).startsWith('解析依赖')) {
            installProgress = { phase: 'resolve' }
            render()
          }
        }
        logEl.scrollTop = logEl.scrollHeight
      })
    }

    function getJson(path) {
      return fetch(path, { cache: 'no-store' }).then(async (res) => {
        const data = await res.json()
        if (!res.ok) throw new Error(data.error || res.statusText)
        return data
      })
    }

    Promise.race([
      getJson('/api/state'),
      new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 2500)),
    ]).then(applyState).catch(() => {
      state.loaded = true
      render()
      maybeLaunch()
    }).finally(listenEvents)

    getJson('/api/remote').then((data) => {
      remote = data
      if (!userPicked) picked = preferredPick()
      render()
    }).catch((error) => { hintEl.textContent = error.message })

    const selfUpdateEl = document.getElementById('selfUpdate')
    const appVerEl = document.getElementById('appVer')
    getJson('/api/self').then((data) => {
      if (appVerEl) appVerEl.textContent = data.current || ''
      if (!data.update || !selfUpdateEl) return
      const url = data.url || `https://github.com/yyh-001/dsh-launcher/releases/latest/download/DSH-Setup.exe`
      selfUpdateEl.hidden = false
      selfUpdateEl.textContent = data.latest ? `更新 ${data.latest}` : '更新'
      selfUpdateEl.title = data.latest ? `更新启动器到 ${data.latest}` : '更新启动器'
      selfUpdateEl.onclick = () => {
        post('/api/open', { url }).catch(() => { location.href = url })
      }
    }).catch(() => {})

    const autoStartEl = document.getElementById('autoStart')
    const seedMarketEl = document.getElementById('seedMarket')
    const autoDisableEl = document.getElementById('autoDisable')
    const settingsHint = document.getElementById('settingsHint')
    const saveSettingsEl = document.getElementById('saveSettings')

    function fillSettings(data) {
      if ('autoStart' in data) autoStartEl.checked = Boolean(data.autoStart)
      if ('seedMarket' in data) seedMarketEl.checked = data.seedMarket !== false
      if ('autoDisablePlugins' in data) autoDisableEl.checked = data.autoDisablePlugins !== false
    }

    function loadSettings() {
      return getJson('/api/settings').then(fillSettings).catch((error) => {
        settingsHint.textContent = error.message
      })
    }

    saveSettingsEl.onclick = async () => {
      saveSettingsEl.disabled = true
      settingsHint.textContent = '正在保存…'
      try {
        const data = await post('/api/settings', {
          autoStart: autoStartEl.checked,
          seedMarket: seedMarketEl.checked,
          autoDisablePlugins: autoDisableEl.checked,
        })
        fillSettings(data)
        settingsHint.textContent = '已保存。'
      } catch (error) {
        settingsHint.textContent = error.message
      } finally {
        saveSettingsEl.disabled = false
      }
    }

    const pluginListEl = document.getElementById('pluginList')
    const pluginHintEl = document.getElementById('pluginHint')
    const pluginSubEl = document.getElementById('pluginSub')
    const pluginRefreshEl = document.getElementById('pluginRefresh')
    let pluginsLoaded = false

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[ch]))
    }

    function stateAutoFix() {
      const names = (state.autoFix?.plugins || []).map((item) => item.name || item.id).filter(Boolean)
      return names.join('、')
    }

    function renderPlugins(data) {
      const list = Array.isArray(data?.plugins) ? data.plugins : []
      const on = list.filter((plugin) => plugin.enabled).length
      if (pluginSubEl) {
        pluginSubEl.textContent = list.length
          ? `${data.profile || 'web'} profile · 共 ${list.length} 个 · ${on} 个启用`
          : `${data.profile || 'web'} profile`
      }
      if (!list.length) {
        pluginListEl.innerHTML = '<div class="plugin-empty">这个 profile 里没有已安装的插件。</div>'
        return
      }
      pluginListEl.innerHTML = list.map((plugin) => {
        const meta = [
          plugin.version ? `v${plugin.version}` : '',
          plugin.ids?.length ? `行 ${plugin.ids.join(', ')}` : '',
          plugin.enabled ? '' : '已禁用',
          plugin.toggleable ? '' : plugin.reason,
        ].filter(Boolean).join(' · ')
        return `<label class="toggle plugin-row${plugin.enabled ? '' : ' off'}" title="${escapeHtml(plugin.reason || plugin.name)}">
          <span class="plugin-main">
            <span class="plugin-name">${escapeHtml(plugin.name)}</span>
            <span class="plugin-meta">${escapeHtml(meta)}</span>
          </span>
          <input type="checkbox" data-plugin="${escapeHtml(plugin.name)}" ${plugin.enabled ? 'checked' : ''} ${plugin.toggleable ? '' : 'disabled'} />
        </label>`
      }).join('')
      pluginListEl.querySelectorAll('input[data-plugin]').forEach((el) => {
        el.onchange = () => { void togglePlugin(el.dataset.plugin, el.checked) }
      })
    }

    async function togglePlugin(name, enabled) {
      pluginHintEl.textContent = `${enabled ? '正在启用' : '正在禁用'} ${name}…`
      try {
        const data = await post('/api/plugins/toggle', { name, enabled })
        renderPlugins(data)
        const changed = data.changed ? '' : '（无变化）'
        pluginHintEl.textContent = `${name} 已${enabled ? '启用' : '禁用'}${changed}。`
      } catch (error) {
        pluginHintEl.textContent = error.message
        loadPlugins()
      }
    }

    function loadPlugins() {
      return getJson('/api/plugins').then((data) => {
        renderPlugins(data)
        const names = (data.autoFix?.plugins || []).map((item) => item.name || item.id).filter(Boolean)
        if (names.length) pluginHintEl.textContent = `上次启动自动禁用了：${names.join('、')}（认为没问题可在上面重新打开）。`
        else if (!pluginsLoaded) pluginHintEl.textContent = ''
        pluginsLoaded = true
      }).catch((error) => { pluginHintEl.textContent = error.message })
    }

    pluginRefreshEl.onclick = async () => {
      pluginRefreshEl.disabled = true
      await loadPlugins()
      pluginRefreshEl.disabled = false
    }

    loadSettings()
  </script>
</body>
</html>
